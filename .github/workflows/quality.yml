name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: build-only-7zF4xQ9mK2vN8pR6sT1wY5cH
      POSTGRES_HOST: localhost
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag frontend-ci:${{ github.sha }} .
